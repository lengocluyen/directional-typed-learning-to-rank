[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dtltr-research"
version = "0.1.0"
description = "Directional typed learning to rank: implementation and reproducible vehicle experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ngoc Luyen Le"}, {name = "Marie-Helene Abel"}, {name = "Philippe Gouspillou"}]
dependencies = [
  "certifi==2026.7.22",
  "cvxpy==1.9.2",
  "clarabel==0.11.1",
  "numpy==2.5.2",
  "PyYAML==6.0.3",
  "pyshacl==0.40.1",
  "rdflib==7.6.0",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "catboost==1.2.10",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dtltr_vehicle*", "rgsmw_next*"]

[tool.setuptools.package-data]
rgsmw_next = ["config/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
